[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2podcast"
version = "0.1.0"
description = "Chaptered, two-voice PDF reading companions with synchronized transcripts"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.2,<8",
    "pypdf>=5,<7",
    "PyMuPDF>=1.24.11,<2",
]

[project.scripts]
pdf2podcast-server = "pdf2podcast.experience_server:main"

[tool.setuptools.packages.find]
where = ["plugins"]
include = ["pdf2podcast"]
